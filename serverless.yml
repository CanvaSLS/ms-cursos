# ms-cursos · cursos, módulos, matrículas, materiales en S3 · productor de ModuloPublicado
service: ms-cursos

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  memorySize: 256
  timeout: 15
  logRetentionInDays: 14
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    SERVICE_NAME: ms-cursos
    DB_HOST: ${cf:sp-infra-${sls:stage}.DbEndpoint}   # RDS MySQL creada en infra-base
    DB_PORT: '3306'
    DB_USER: admin
    DB_PASSWORD: ${env:DB_PASSWORD}                    # export DB_PASSWORD=... antes de desplegar (no se sube al repo)
    TOPIC_ARN: arn:aws:sns:${aws:region}:${aws:accountId}:sp-eventos-${sls:stage}
    BUCKET: sp-storage-${aws:accountId}-${sls:stage}

custom:
  auth:   # Lambda Authorizer de ms-auth (mismo token para todos los microservicios)
    arn: arn:aws:lambda:${aws:region}:${aws:accountId}:function:ms-auth-${sls:stage}-autorizar
    type: token
    identitySource: method.request.header.Authorization
    resultTtlInSeconds: 0

package:
  patterns:
    - '!**'
    - '*.py'
    - 'vendor/**'      # pymysql: pip install -r requirements.txt -t vendor

functions:
  listarCursos:
    handler: handler.listar_cursos
    events:
      - http: { path: cursos, method: get, cors: true, authorizer: "${self:custom.auth}" }
  crearCurso:
    handler: handler.crear_curso
    events:
      - http: { path: cursos, method: post, cors: true, authorizer: "${self:custom.auth}" }
  modificarCurso:
    handler: handler.modificar_curso
    events:
      - http: { path: 'cursos/{curso_id}', method: put, cors: true, authorizer: "${self:custom.auth}" }
  eliminarCurso:
    handler: handler.eliminar_curso
    events:
      - http: { path: 'cursos/{curso_id}', method: delete, cors: true, authorizer: "${self:custom.auth}" }
  listarModulos:
    handler: handler.listar_modulos
    events:
      - http: { path: 'cursos/{curso_id}/modulos', method: get, cors: true, authorizer: "${self:custom.auth}" }
  publicarModulo:
    handler: handler.publicar_modulo
    events:
      - http: { path: 'cursos/{curso_id}/modulos', method: post, cors: true, authorizer: "${self:custom.auth}" }
  matricularEstudiante:
    handler: handler.matricular_estudiante
    events:
      - http: { path: 'cursos/{curso_id}/matriculas', method: post, cors: true, authorizer: "${self:custom.auth}" }
  listarMatriculas:
    handler: handler.listar_matriculas
    events:
      - http: { path: 'cursos/{curso_id}/matriculas', method: get, cors: true, authorizer: "${self:custom.auth}" }
  agregarMaterial:
    handler: handler.agregar_material
    events:
      - http: { path: 'cursos/{curso_id}/modulos/{modulo_id}/materiales', method: post, cors: true, authorizer: "${self:custom.auth}" }
  descargarMaterial:
    handler: handler.descargar_material
    events:
      - http: { path: 'cursos/{curso_id}/modulos/{modulo_id}/materiales/{material_id}/descarga', method: get, cors: true, authorizer: "${self:custom.auth}" }

resources:
  Resources:
    GatewayResponse4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
    GatewayResponse5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
